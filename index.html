if(trMode===3){el('h2',trReveal?t.q:'先听问题，也可以查看文字',card);button('🔊 听问句',()=>say(t.q),card);button('查看问句',()=>{trReveal=true;renderTraining()},card);if(!trOptions.length){trOptions=[t.answer,...training.filter(x=>x!==t).slice(0,2).map(x=>x.answer)];for(let i=trOptions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[trOptions[i],trOptions[j]]=[trOptions[j],trOptions[i]]}}for(let [i,v] of trOptions.entries())button(v,()=>{trChoice=i;renderTraining();say(v)},card);if(trChoice>=0)el('p',trOptions[trChoice]===t.answer?'回答匹配 · '+t.az:'再听一次，或者查看问句。',card);button('不看选项，自己说 / 查看参考答案',()=>{trFeedback=t.answer+' · '+t.az;renderTraining()},card);if(trFeedback)el('p',trFeedback,card)}
if(trMode===4){let due=training.map((x,i)=>({x,i})).filter(({x})=>!trRecords[x.q]||trRecords[x.q]<=Date.now());el('p','待复习：'+due.length+' 组（可随时练习任何主题）',card);if(due.length)button('选择待复习主题',()=>{trTopic=due[0].i;reset();renderTraining()},card);button('🔊 听问句',()=>say(t.q),card);button('查看原文和答案',()=>{trReveal=true;renderTraining()},card);if(trReveal){el('p',t.q+' · '+t.zh,card);el('p',t.answer+' · '+t.az,card)}for(let [s,days] of [['很陌生',0],['有点熟悉',1],['已经掌握',3]])button(s,()=>{trRecords[t.q]=Date.now()+days*86400000+(days===0?600000:0);try{localStorage.setItem('monfrancaisTraining',JSON.stringify(trRecords));trFeedback='已记录，下次建议：'+(days===0?'10分钟后':days+'天后')}catch(e){trFeedback='本次已记录，但浏览器无法持久保存'}renderTraining()},card);if(trFeedback)el('p',trFeedback,card)}
el('p','不计分、不限时；可以随时切换训练。',card)}

function render(){if(activeBlock==='exam'){navigationExam();miniExamTables();return}if(activeBlock==='training'){renderTraining();return}if(activeBlock==='listen'){renderListening();return}const sections=navigation();let isRules=activeBlock==='grammar'||activeBlock==='sound';const seen=new Set();for(const [title,originalItems,sourceDate] of sections){let items=originalItems;if(specialTable(title,items,sourceDate))continue;let series=splitSeries(title,items);if(series&&series[1].length){compactList(series[0],series[1],sourceDate);const selected=new Set(series[1]);items=items.filter(x=>!selected.has(x));if(!items.length)continue}let h=document.createElement('h2');h.textContent=title;$('root').append(h);let intro=document.createElement('p');intro.className='intro';intro.textContent=title.includes('Vous')?'Vous（您）：初次见面、陌生成年人或较正式场合；votre = 您的。':title.includes('Tu')?'Tu（你）：朋友、家人或熟悉的人；toi = 你，ton = 你的。':title.includes('语法规则')?'以下为课堂已学规则及适用范围。':'';$('root').append(intro);for(const [fr,zh,q] of items){if(questions&&!q&&!isRules)continue;const identity=fr.replace(/[.!?]$/,'').trim().toLowerCase();if(seen.has(identity)&&activeBlock!=='journal'&&activeBlock!=='today')continue;seen.add(identity);let a=document.createElement('article');if(q)a.className='q';let line=document.createElement('div');line.className='line';let words=document.createElement('div');words.className='words';let def=document.createElement('div');def.className='definition';def.hidden=true;def.setAttribute('aria-live','polite');for(const token of fr.split(' ')){let b=document.createElement('button');b.className='word';b.textContent=token;const key=token.toLowerCase().replace(/[^\p{L}’'\-]/gu,'');if(!key){words.append(document.createTextNode(token));continue}b.onclick=()=>{say(token);document.querySelectorAll('.definition').forEach(x=>x.hidden=true);document.querySelectorAll('.word.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');def.replaceChildren(document.createTextNode(token.replace(/[,.?!]/g,'')+posLabel(key)+' · '+(dictionary[key]||'内置词典暂未收录')));let lookup=document.createElement('a');lookup.href='https://www.wordreference.com/frzh/'+encodeURIComponent(key);lookup.target='_blank';lookup.rel='noopener noreferrer';lookup.textContent='外部法中词典 ↗（联网）';lookup.style.cssText='display:block;margin-top:8px;color:inherit;text-decoration:underline';def.append(lookup);def.hidden=false};words.append(b,document.createTextNode(' '))}let b=document.createElement('button');b.className='play';b.textContent='🔊 整句';b.onclick=()=>say(fr);let z=document.createElement('div');z.className='zh';z.textContent=zh;line.append(words,b);a.append(line,z,def);let source=document.createElement('small');source.className='source';source.textContent=sourceDate?'来源：'+sourceDate:activeBlock==='today'&&todaysLesson()?'来源：'+todaysLesson().date+' · Jour '+todaysLesson().day:'来源：2026年11月19日 · Jour 2';a.append(source);if(notes[fr]){let n=document.createElement('div');n.className='note';n.textContent='重点 · '+notes[fr];a.append(n)}$('root').append(a)}}}
$('notes').onclick=()=>{$('notes').textContent=document.body.classList.toggle('noNotes')?'显示语法':'隐藏语法'};$('hide').onclick=()=>{$('hide').textContent=document.body.classList.toggle('hide')?'显示中文':'隐藏中文'};$('focus').onclick=()=>{questions=!questions;$('focus').textContent=questions?'显示全部':'只看问句';render()};$('test').onclick=()=>say('Bonjour, comment ça va ?');$('stop').onclick=()=>{current=null;if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent=''};render();
