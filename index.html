<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mon français</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#23382f;font:17px system-ui}main,header{max-width:760px;margin:auto;padding:18px}h1{font-size:32px;margin:8px 0}h2{font-size:22px}button,select{font:inherit;color:inherit;background:white;border:1px solid #ccd6ce;border-radius:10px;padding:10px;cursor:pointer}nav{position:sticky;top:0;background:#f5f5ef;padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;z-index:1}article{background:white;border:1px solid #dce4dd;border-radius:14px;margin:10px 0;padding:14px}article.q{border-left:4px solid #37765e}.line{display:flex;align-items:flex-start;gap:8px}.words{flex:1;line-height:1.8}.word{border:0;padding:2px 4px;font-size:21px;text-decoration:underline;text-decoration-color:#bbcfc1;text-underline-offset:5px}.play{font-size:14px;white-space:nowrap}.zh{font-size:15px;color:#64736b;margin-top:6px}body.hide .zh{display:none}#status{font-size:13px;color:#56665d;min-height:1.4em}small{color:#64736b}.note{margin-top:10px;padding:9px 11px;background:#eff5ef;border-radius:8px;font-size:14px;line-height:1.6;color:#365847}.intro{font-size:15px;line-height:1.6;color:#56665d;margin:4px 0 14px}body.hide .note,body.hide .intro,body.noNotes .note,body.noNotes .intro{display:none}:root{color-scheme:light dark}@media(prefers-color-scheme:dark){body,nav{background:#171e1b;color:#e3e9e4}article{background:#232d28;border-color:#3a4940}button,select{background:#2a352e;color:#e3e9e4;border-color:#495b4e}.word{text-decoration-color:#607f6b}.zh,small,.intro,#status{color:#b3c2b8}.note{background:#283e33;color:#c1dfcc}article.q{border-left-color:#79ad8d}}.definition{margin-top:9px;padding:10px 12px;border:1px solid #b9cebd;border-radius:9px;font-size:16px;line-height:1.5;background:#f6faf6}.word.selected{background:#dbece0;text-decoration:none}.definition[hidden]{display:none}@media(prefers-color-scheme:dark){.definition{background:#293a31;border-color:#526c5c;color:#dcebe0}.word.selected{background:#385743;color:#f0f7f2}}</style></head><body><header><small>我的法语课堂 · 2026 · 11月18日开学</small><h1>Mon français</h1><p><strong>Jour 2 · 2026年11月19日</strong><br><small>Jour 1 · 11月18日开学（课堂资料待补充）</small></p><p>点击单词发音，点击整句听完整表达。</p></header><main><nav><select id="lesson" aria-label="课程"><option value="p26">Day 2 · Jour 2 · 11月19日 · 课本第26页</option></select><select id="speed" aria-label="语速"><option value="1">正常 1×</option><option value=".8">稍慢 0.8×</option><option value=".6">慢速 0.6×</option></select><button id="hide">隐藏中文</button><button id="test">测试声音</button><button id="stop">停止</button><button id="notes">隐藏语法</button><button id="focus">只看问句</button><div id="status" role="status"></div></nav><p class="lessondate"><strong>Day 2 · 2026年11月19日</strong><br><small>课本第26页 · 问候、自我介绍与国籍来源</small></p><div id="root"></div><p><small>发音使用设备语音合成，优先加拿大法语；若设备没有该语音则使用其他法语语音。单词孤立发音与整句连读可能不同。</small></p></main><script>
const lessons={p26:[["正式问法 · Vous",[
["Bonjour, comment ça va ?","你好，最近怎么样？",1],["Ça va bien, merci.","我很好，谢谢。"],["Quel est votre nom ?","您叫什么名字？",1],["Je m’appelle Maria Gomez et vous ?","我叫 Maria Gomez，您呢？",1],["Moi, je m’appelle Kuy Fing.","我叫 Kuy Fing。"],["De quel pays vous venez ?","您来自哪个国家？",1],["Je viens du Salvador et vous ?","我来自萨尔瓦多，您呢？",1],["Moi, je viens de Chine.","我来自中国。"]]],["非正式问法 · Tu",[
["Bonjour, comment ça va ?","你好，最近怎么样？",1],["Ça va et toi ?","挺好的，你呢？",1],["Pas pire.","还不错。"],["Comment tu t’appelles ?","你叫什么名字？",1],["Je m’appelle Mustapha Ali.","我叫 Mustapha Ali。"],["Et toi, c’est quoi ton nom ?","你呢，你叫什么名字？",1],["Je suis Manolo Rodriguez.","我是 Manolo Rodriguez。"],["Tu viens d’où ?","你来自哪里？",1],["De Somalie et toi ?","来自索马里，你呢？",1],["Moi, je viens du Chili.","我来自智利。"]]]]};
const dictionary={"bonjour":"你好；日间问候语","comment":"怎么；怎么样 · 疑问副词","ça":"这；那；这里泛指情况","va":"动词 aller 的变位；这里表示情况如何","bien":"好；很好 · 副词","merci":"谢谢","quel":"什么；哪个 · 阳性单数疑问限定词","est":"是 · être 的变位","votre":"您的；你们的 · 物主限定词","nom":"名字；名称 · 阳性名词","je":"我 · 主语代词","m’appelle":"叫作；m’ = me，appelle 来自 appeler","maria":"Maria · 人名","gomez":"Gomez · 姓氏","et":"和；以及","vous":"您；你们 · 人称代词","moi":"我 · 重读人称代词","kuy":"Kuy · 人名","fing":"Fing · 人名的一部分","de":"从；来自；……的 · 介词","pays":"国家 · 阳性名词","venez":"来；来自 · venir 对应 vous 的变位","viens":"来；来自 · venir 对应 je / tu 的变位","du":"de + le 的缩合；这里表示来自","salvador":"萨尔瓦多 · 国家名","chine":"中国 · 国家名","toi":"你 · 重读人称代词","pas":"不 · 否定词","pire":"更坏；更糟；pas pire 在魁北克口语中表示还不错","tu":"你 · 非正式单数主语代词","t’appelles":"叫作；t’ = te，appelles 来自 appeler","mustapha":"Mustapha · 人名","ali":"Ali · 人名的一部分","c’est":"这是；是 · ce + est 的缩合形式","quoi":"什么 · 疑问代词","ton":"你的 · 阳性单数名词前的物主限定词","suis":"是 · être 对应 je 的变位","manolo":"Manolo · 人名","rodriguez":"Rodriguez · 姓氏","d’où":"从哪里 · de + où","somalie":"索马里 · 国家名","chili":"智利 · 国家名"};const notes={"Bonjour, comment ça va ?":"comment = 怎么样；ça va = 情况好吗。正式和非正式场合都可以用。","Ça va bien, merci.":"bien = 好；merci = 谢谢。","Quel est votre nom ?":"正式 · quel = 什么；est = 是；votre nom = 您的名字。","Je m’appelle Maria Gomez et vous ?":"je m’appelle = 我叫……；et vous ? = 您呢？","Moi, je m’appelle Kuy Fing.":"moi = 我（强调）；je m’appelle = 我叫……","De quel pays vous venez ?":"正式 · de quel pays = 来自哪个国家；vous venez = 您来自。","Je viens du Salvador et vous ?":"je viens = 我来自；du = de + le；et vous ? = 您呢？","Moi, je viens de Chine.":"je viens de = 我来自……；这里保留课本的 de Chine。","Ça va et toi ?":"非正式 · et toi ? = 你呢？","Pas pire.":"魁北克常见口语：还不错。","Comment tu t’appelles ?":"非正式 · comment = 怎么；tu t’appelles = 你叫……。对比 je m’appelle。","Je m’appelle Mustapha Ali.":"je m’appelle = 我叫……","Et toi, c’est quoi ton nom ?":"非正式 · c’est quoi = 是什么；ton nom = 你的名字；对比 votre nom。","Je suis Manolo Rodriguez.":"je suis = 我是……","Tu viens d’où ?":"非正式 · tu viens = 你来自；d’où = de + où（从哪里）。","De Somalie et toi ?":"省略了 je viens；et toi ? = 你呢？","Moi, je viens du Chili.":"je viens = 我来自；du = de + le。"};const $=id=>document.getElementById(id);let questions=false,current;function say(t){if(!window.speechSynthesis){$('status').textContent='浏览器不支持语音，请使用 Safari。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);current=u;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.toLowerCase()==='fr-ca')||vs.find(x=>x.lang.toLowerCase().startsWith('fr'));u.lang=v?v.lang:'fr-CA';if(v)u.voice=v;u.rate=Number($('speed').value);$('status').textContent='播放：'+t;u.onend=()=>{if(current===u)$('status').textContent=''};u.onerror=e=>{if(current===u)$('status').textContent='播放未完成：'+e.error};speechSynthesis.speak(u)}
function render(){$('root').replaceChildren();for(const [title,items] of lessons[$('lesson').value]){let h=document.createElement('h2');h.textContent=title;$('root').append(h);let intro=document.createElement('p');intro.className='intro';intro.textContent=title.includes('Vous')?'Vous（您）：初次见面、陌生成年人或较正式场合；votre = 您的。':'Tu（你）：朋友、家人或熟悉的人；toi = 你，ton = 你的。';$('root').append(intro);for(const [fr,zh,q] of items){if(questions&&!q)continue;let a=document.createElement('article');if(q)a.className='q';let line=document.createElement('div');line.className='line';let words=document.createElement('div');words.className='words';let def=document.createElement('div');def.className='definition';def.hidden=true;def.setAttribute('aria-live','polite');for(const token of fr.split(' ')){let b=document.createElement('button');b.className='word';b.textContent=token;const key=token.toLowerCase().replace(/[^\p{L}’']/gu,'');if(!key){words.append(document.createTextNode(token));continue}b.onclick=()=>{say(token);document.querySelectorAll('.definition').forEach(x=>x.hidden=true);document.querySelectorAll('.word.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');def.textContent=token.replace(/[,.?!]/g,'')+' · '+(dictionary[key]||'释义待补充');def.hidden=false};words.append(b,document.createTextNode(' '))}let b=document.createElement('button');b.className='play';b.textContent='🔊 整句';b.onclick=()=>say(fr);let z=document.createElement('div');z.className='zh';z.textContent=zh;line.append(words,b);a.append(line,z,def);if(notes[fr]){let n=document.createElement('div');n.className='note';n.textContent='重点 · '+notes[fr];a.append(n)}$('root').append(a)}}}
$('notes').onclick=()=>{$('notes').textContent=document.body.classList.toggle('noNotes')?'显示语法':'隐藏语法'};$('lesson').onchange=render;$('hide').onclick=()=>{$('hide').textContent=document.body.classList.toggle('hide')?'显示中文':'隐藏中文'};$('focus').onclick=()=>{questions=!questions;$('focus').textContent=questions?'显示全部':'只看问句';render()};$('test').onclick=()=>say('Bonjour, comment ça va ?');$('stop').onclick=()=>{current=null;if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent=''};render();
</script></body></html>
