function navigation(){let m=$('menu');m.replaceChildren();$('root').replaceChildren();$('controls').hidden=activeTopic<0;$('focus').hidden=activeBlock==='grammar'||activeBlock==='sound';if(!activeBlock){let today=todaysLesson();if(today){menuButton(m,'今日课堂 · Cours du jour',today.date+' · 按课堂顺序复习',()=>navigate('today',0));}else{let p=document.createElement('p');p.className='source';p.textContent='今日课堂：暂无当天笔记。以往课堂可在日期索引中复习。';m.append(p)}menuButton(m,'🎧 听力练习 · Écoute','先听整句，再揭晓文字；不计分',()=>{listenIndex=0;listenShown=false;navigate('listen',0)});let grid=document.createElement('div');grid.className='homegrid';for(const [k,v] of Object.entries(blocks))menuButton(grid,v.label,v.topics.length+' 个主题',()=>navigate(k));m.append(grid);return []}menuButton(m,'‹ 首页','',()=>navigate(''));if(activeBlock==='today'){let today=todaysLesson();if(!today)return [];let h=document.createElement('h2');h.textContent='今日课堂 · '+today.date;m.append(h);return today.sections}let h=document.createElement('h2');h.textContent=blocks[activeBlock].label;m.append(h);if(activeTopic<0){for(const [i,t] of blocks[activeBlock].topics.entries())menuButton(m,t[0],topicData(t).reduce((a,x)=>a+x[1].length,0)+' 条学习内容',()=>navigate(activeBlock,i));return []}menuButton(m,'‹ 返回主题列表','',()=>navigate(activeBlock));let h3=document.createElement('h2');h3.textContent=blocks[activeBlock].topics[activeTopic][0];m.append(h3);return topicData(blocks[activeBlock].topics[activeTopic])}

const $=id=>document.getElementById(id);let questions=false,current;function say(t){if(!window.speechSynthesis){$('status').textContent='浏览器不支持语音，请使用 Safari。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);current=u;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.toLowerCase()==='fr-ca')||vs.find(x=>x.lang.toLowerCase().startsWith('fr'));u.lang=v?v.lang:'fr-CA';if(v)u.voice=v;u.rate=Number($('speed').value);$('status').textContent=activeBlock==='listen'?'正在播放…':'播放：'+t;u.onend=()=>{if(current===u)$('status').textContent=''};u.onerror=e=>{if(current===u)$('status').textContent='播放未完成：'+e.error};speechSynthesis.speak(u)}
function compactList(title,items,sourceDate){if(questions)return;let a=document.createElement('article');a.className='compactList';let bar=document.createElement('div');bar.className='line';let h=document.createElement('strong');h.textContent=title;let play=document.createElement('button');play.textContent='🔊 连续朗读';play.onclick=()=>say(items.map(x=>x[0]).join(', '));bar.append(h,play);a.append(bar);let grid=document.createElement('div');grid.className='compactGrid';for(const [fr,zh] of items){let b=document.createElement('button');b.className='compactWord';let f=document.createElement('span');f.textContent=fr;let z=document.createElement('small');z.className='zh';z.textContent=zh;b.append(f,z);b.onclick=()=>say(fr);grid.append(b)}a.append(grid);let source=document.createElement('small');source.className='source';source.textContent='来源：'+(sourceDate||'2026年11月19日 · Jour 2');a.append(source);$('root').append(a)}
function splitSeries(title,items){if(title==='日期与月份')return ['月份',items.filter(x=>/^(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)$/.test(x[0]))];if(title==='四季')return ['四季',items.filter(x=>/^(le printemps|l’été|l’automne|l’hiver)$/.test(x[0]))];if(/^(星期|补充练习 · 星期|数字 1–20|补充练习 · 数字 1–100)$/.test(title))return [title,items];return null}

function compactTable(title,rows,sourceDate,headers,example){
 if(questions)return;let a=document.createElement('article');a.className='compactList';let bar=document.createElement('div');bar.className='line';let h=document.createElement('strong');h.textContent=title;let play=document.createElement('button');play.textContent='🔊 连续朗读';play.onclick=()=>say(rows.flatMap(x=>x.slice(0,-1)).filter(Boolean).join(', '));bar.append(h,play);a.append(bar);
 if(example){let b=document.createElement('button');b.className='word';b.textContent=example;b.onclick=()=>say(example);a.append(b)}
 let table=document.createElement('table');table.className='studyTable';let head=table.createTHead().insertRow();headers.forEach((x,i)=>{let th=document.createElement('th');th.textContent=x;if(i===headers.length-1)th.className='zh';head.append(th)});let body=table.createTBody();let def=document.createElement('div');def.className='definition';def.hidden=true;
 for(const row of rows){let tr=body.insertRow();row.forEach((x,i)=>{let td=tr.insertCell();if(i===row.length-1){td.className='zh';td.textContent=x;return}if(!x){td.textContent='—';return}let b=document.createElement('button');b.className='word';b.textContent=x;b.onclick=()=>{say(x);document.querySelectorAll('.definition').forEach(y=>y.hidden=true);def.replaceChildren(document.createTextNode(x+posLabel(x)+' · '+(dictionary[x.toLowerCase()]||row[row.length-1])));let link=document.createElement('a');link.href='https://www.wordreference.com/frzh/'+encodeURIComponent(x);link.target='_blank';link.rel='noopener noreferrer';link.textContent=' 外部词典 ↗';def.append(link);def.hidden=false};td.append(b)})}
 a.append(table,def);let s=document.createElement('small');s.className='source';s.textContent='来源：'+(sourceDate||'2026年11月19日 · Jour 2');a.append(s);$('root').append(a)
}
function specialTable(title,items,date){
 if(/^(Être|Avoir)( · 现在时)?$/.test(title)){compactTable(title,items.map(x=>x.slice(0,2)),date,['人称变位','中文']);return true}
 if(/^(定冠词|定冠词与省音|相对时间|课堂术语)$/.test(title)){compactTable(title,items.map(x=>x.slice(0,2)),date,['法语','中文']);return true}

 if(/^(国籍 · 阳性与阴性|教材 p.12 · 国籍|职业)$/.test(title)){let rows=[];for(const [f,z] of items){let label=z.replace(/（男性）|（女性）|（男女同形）/g,'');let parts=f.split(' / ');if(parts.length===2)rows.push([...parts,label]);else if(z.includes('（男性）'))rows.push([f,'',label]);else if(z.includes('（女性）')){let p=rows.find(x=>x[2]===label&&!x[1]);if(p)p[1]=f;else rows.push(['',f,label])}else if(f==='mère au foyer')rows.push(['',f,label]);else rows.push([f,f,label])}compactTable(title,rows,date,['阳性','阴性','中文'],'Je suis…');return true}
 if(/^(课堂笔记 · 我来自……|教材 p.11 · 国家来源|国家来源复习|教材 p.12 · 居住地)$/.test(title)){let rows=items.map(([f,z])=>[f.replace(/^Je (viens|suis|habite) /,'').replace(/\.$/,''),z.replace(/^我(来自|住在)\s*/,'').replace(/。$/,'')]);compactTable(title,rows,date,['来源／地点','中文'],items[0][0]);return true}
 if(/^(教材 p.11 · 国家名称|国家名称|语言词汇)$/.test(title)){compactTable(title,items.map(x=>x.slice(0,2)),date,['法语','中文']);return true}return false
}
function render(){if(activeBlock==='listen'){renderListening();return}const sections=navigation();let isRules=activeBlock==='grammar'||activeBlock==='sound';const seen=new Set();for(const [title,originalItems,sourceDate] of sections){let items=originalItems;if(specialTable(title,items,sourceDate))continue;let series=splitSeries(title,items);if(series&&series[1].length){compactList(series[0],series[1],sourceDate);const selected=new Set(series[1]);items=items.filter(x=>!selected.has(x));if(!items.length)continue}let h=document.createElement('h2');h.textContent=title;$('root').append(h);let intro=document.createElement('p');intro.className='intro';intro.textContent=title.includes('Vous')?'Vous（您）：初次见面、陌生成年人或较正式场合；votre = 您的。':title.includes('Tu')?'Tu（你）：朋友、家人或熟悉的人；toi = 你，ton = 你的。':title.includes('语法规则')?'以下为课堂已学规则及适用范围。':'';$('root').append(intro);for(const [fr,zh,q] of items){if(questions&&!q&&!isRules)continue;const identity=fr.replace(/[.!?]$/,'').trim().toLowerCase();if(seen.has(identity)&&activeBlock!=='journal'&&activeBlock!=='today')continue;seen.add(identity);let a=document.createElement('article');if(q)a.className='q';let line=document.createElement('div');line.className='line';let words=document.createElement('div');words.className='words';let def=document.createElement('div');def.className='definition';def.hidden=true;def.setAttribute('aria-live','polite');for(const token of fr.split(' ')){let b=document.createElement('button');b.className='word';b.textContent=token;const key=token.toLowerCase().replace(/[^\p{L}’'\-]/gu,'');if(!key){words.append(document.createTextNode(token));continue}b.onclick=()=>{say(token);document.querySelectorAll('.definition').forEach(x=>x.hidden=true);document.querySelectorAll('.word.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');def.replaceChildren(document.createTextNode(token.replace(/[,.?!]/g,'')+posLabel(key)+' · '+(dictionary[key]||'内置词典暂未收录')));let lookup=document.createElement('a');lookup.href='https://www.wordreference.com/frzh/'+encodeURIComponent(key);lookup.target='_blank';lookup.rel='noopener noreferrer';lookup.textContent='外部法中词典 ↗（联网）';lookup.style.cssText='display:block;margin-top:8px;color:inherit;text-decoration:underline';def.append(lookup);def.hidden=false};words.append(b,document.createTextNode(' '))}let b=document.createElement('button');b.className='play';b.textContent='🔊 整句';b.onclick=()=>say(fr);let z=document.createElement('div');z.className='zh';z.textContent=zh;line.append(words,b);a.append(line,z,def);let source=document.createElement('small');source.className='source';source.textContent=sourceDate?'来源：'+sourceDate:activeBlock==='today'&&todaysLesson()?'来源：'+todaysLesson().date+' · Jour '+todaysLesson().day:'来源：2026年11月19日 · Jour 2';a.append(source);if(notes[fr]){let n=document.createElement('div');n.className='note';n.textContent='重点 · '+notes[fr];a.append(n)}$('root').append(a)}}}
$('notes').onclick=()=>{$('notes').textContent=document.body.classList.toggle('noNotes')?'显示语法':'隐藏语法'};$('hide').onclick=()=>{$('hide').textContent=document.body.classList.toggle('hide')?'显示中文':'隐藏中文'};$('focus').onclick=()=>{questions=!questions;$('focus').textContent=questions?'显示全部':'只看问句';render()};$('test').onclick=()=>say('Bonjour, comment ça va ?');$('stop').onclick=()=>{current=null;if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent=''};render();
