const $=id=>document.getElementById(id);let questions=false,current;function say(t){if(!window.speechSynthesis){$('status').textContent='浏览器不支持语音，请使用 Safari。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);current=u;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.toLowerCase()==='fr-ca')||vs.find(x=>x.lang.toLowerCase().startsWith('fr'));u.lang=v?v.lang:'fr-CA';if(v)u.voice=v;u.rate=Number($('speed').value);$('status').textContent='播放：'+t;u.onend=()=>{if(current===u)$('status').textContent=''};u.onerror=e=>{if(current===u)$('status').textContent='播放未完成：'+e.error};speechSynthesis.speak(u)}
function render(){const sections=navigation();let isRules=activeBlock==='grammar'||activeBlock==='sound';const seen=new Set();for(const [title,items] of sections){let h=document.createElement('h2');h.textContent=title;$('root').append(h);let intro=document.createElement('p');intro.className='intro';intro.textContent=title.includes('Vous')?'Vous（您）：初次见面、陌生成年人或较正式场合；votre = 您的。':title.includes('Tu')?'Tu（你）：朋友、家人或熟悉的人；toi = 你，ton = 你的。':title.includes('语法规则')?'来源：11月19日老师的课堂总结。以下仅整理课堂已学规则，不作为所有国家名称的完整语法规则。':'';$('root').append(intro);for(const [fr,zh,q] of items){if(questions&&!q&&!isRules)continue;const identity=fr.replace(/[.!?]$/,'').trim().toLowerCase();if(seen.has(identity)&&activeBlock!=='journal'&&activeBlock!=='today')continue;seen.add(identity);let a=document.createElement('article');if(q)a.className='q';let line=document.createElement('div');line.className='line';let words=document.createElement('div');words.className='words';let def=document.createElement('div');def.className='definition';def.hidden=true;def.setAttribute('aria-live','polite');for(const token of fr.split(' ')){let b=document.createElement('button');b.className='word';b.textContent=token;const key=token.toLowerCase().replace(/[^\p{L}’'\-]/gu,'');if(!key){words.append(document.createTextNode(token));continue}b.onclick=()=>{say(token);document.querySelectorAll('.definition').forEach(x=>x.hidden=true);document.querySelectorAll('.word.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');def.textContent=token.replace(/[,.?!]/g,'')+' · '+(dictionary[key]||'释义待补充');def.hidden=false};words.append(b,document.createTextNode(' '))}let b=document.createElement('button');b.className='play';b.textContent='🔊 整句';b.onclick=()=>say(fr);let z=document.createElement('div');z.className='zh';z.textContent=zh;line.append(words,b);a.append(line,z,def);let source=document.createElement('small');source.className='source';source.textContent=activeBlock==='today'&&todaysLesson()?'来源：'+todays
