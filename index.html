<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mon français</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#23382f;font:17px system-ui}main,header{max-width:760px;margin:auto;padding:18px}h1{font-size:32px;margin:8px 0}h2{font-size:22px}button,select{font:inherit;color:inherit;background:white;border:1px solid #ccd6ce;border-radius:10px;padding:10px;cursor:pointer}nav{position:sticky;top:0;background:#f5f5ef;padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;z-index:1}article{background:white;border:1px solid #dce4dd;border-radius:14px;margin:10px 0;padding:14px}article.q{border-left:4px solid #37765e}.line{display:flex;align-items:flex-start;gap:8px}.words{flex:1;line-height:1.8}.word{border:0;padding:2px 4px;font-size:21px;text-decoration:underline;text-decoration-color:#bbcfc1;text-underline-offset:5px}.play{font-size:14px;white-space:nowrap}.zh{font-size:15px;color:#64736b;margin-top:6px}body.hide .zh{display:none}#status{font-size:13px;color:#56665d;min-height:1.4em}small{color:#64736b}</style></head><body><header><small>我的法语课堂 · 2026</small><h1>Mon français</h1><p>点击单词发音，点击整句听完整表达。</p></header><main><nav><select id="lesson" aria-label="课程"><option value="p26">11月19日 · 课本第26页</option></select><select id="speed" aria-label="语速"><option value="1">正常 1×</option><option value=".8">稍慢 0.8×</option><option value=".6">慢速 0.6×</option></select><button id="hide">隐藏中文</button><button id="test">测试声音</button><button id="stop">停止</button><button id="focus">只看问句</button><div id="status" role="status"></div></nav><div id="root"></div><p><small>发音使用设备语音合成，优先加拿大法语；若设备没有该语音则使用其他法语语音。单词孤立发音与整句连读可能不同。</small></p></main><script>
const lessons={p26:[["正式问法 · Vous",[
["Bonjour, comment ça va ?","你好，最近怎么样？",1],["Ça va bien, merci.","我很好，谢谢。"],["Quel est votre nom ?","您叫什么名字？",1],["Je m’appelle Maria Gomez et vous ?","我叫 Maria Gomez，您呢？",1],["Moi, je m’appelle Kuy Fing.","我叫 Kuy Fing。"],["De quel pays vous venez ?","您来自哪个国家？",1],["Je viens du Salvador et vous ?","我来自萨尔瓦多，您呢？",1],["Moi, je viens de Chine.","我来自中国。"]]],["非正式问法 · Tu",[
["Bonjour, comment ça va ?","你好，最近怎么样？",1],["Ça va et toi ?","挺好的，你呢？",1],["Pas pire.","还不错。"],["Comment tu t’appelles ?","你叫什么名字？",1],["Je m’appelle Mustapha Ali.","我叫 Mustapha Ali。"],["Et toi, c’est quoi ton nom ?","你呢，你叫什么名字？",1],["Je suis Manolo Rodriguez.","我是 Manolo Rodriguez。"],["Tu viens d’où ?","你来自哪里？",1],["De Somalie et toi ?","来自索马里，你呢？",1],["Moi, je viens du Chili.","我来自智利。"]]]]};
const $=id=>document.getElementById(id);let questions=false,current;function say(t){if(!window.speechSynthesis){$('status').textContent='浏览器不支持语音，请使用 Safari。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);current=u;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.toLowerCase()==='fr-ca')||vs.find(x=>x.lang.toLowerCase().startsWith('fr'));u.lang=v?v.lang:'fr-CA';if(v)u.voice=v;u.rate=Number($('speed').value);$('status').textContent='播放：'+t;u.onend=()=>{if(current===u)$('status').textContent=''};u.onerror=e=>{if(current===u)$('status').textContent='播放未完成：'+e.error};speechSynthesis.speak(u)}
function render(){$('root').replaceChildren();for(const [title,items] of lessons[$('lesson').value]){let h=document.createElement('h2');h.textContent=title;$('root').append(h);for(const [fr,zh,q] of items){if(questions&&!q)continue;let a=document.createElement('article');if(q)a.className='q';let line=document.createElement('div');line.className='line';let words=document.createElement('div');words.className='words';for(const token of fr.split(' ')){let b=document.createElement('button');b.className='word';b.textContent=token;b.onclick=()=>say(token);words.append(b,document.createTextNode(' '))}let b=document.createElement('button');b.className='play';b.textContent='🔊 整句';b.onclick=()=>say(fr);let z=document.createElement('div');z.className='zh';z.textContent=zh;line.append(words,b);a.append(line,z);$('root').append(a)}}}
$('lesson').onchange=render;$('hide').onclick=()=>{$('hide').textContent=document.body.classList.toggle('hide')?'显示中文':'隐藏中文'};$('focus').onclick=()=>{questions=!questions;$('focus').textContent=questions?'显示全部':'只看问句';render()};$('test').onclick=()=>say('Bonjour, comment ça va ?');$('stop').onclick=()=>{current=null;if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent=''};render();
</script></body></html>
